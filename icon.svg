<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b31"/>
      <stop offset="1" stop-color="#141417"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e9e7e1"/>
      <stop offset="1" stop-color="#b9b6ae"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f4ec"/>
      <stop offset="1" stop-color="#e2ddd1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#08080a"/>
  <g transform="translate(256 262) scale(1.15) translate(-256 -262)">
  <!-- diffuser dome -->
  <path d="M176 150 A80 80 0 0 1 336 150 Z" fill="url(#dome)"/>
  <rect x="166" y="142" width="180" height="22" rx="6" fill="#3a3a42"/>
  <!-- meter body -->
  <rect x="136" y="158" width="240" height="290" rx="44" fill="url(#body)" stroke="#3b3b42" stroke-width="4"/>
  <!-- analog dial window -->
  <rect x="164" y="190" width="184" height="128" rx="20" fill="url(#face)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M190 300 A72 72 0 0 1 322 300" stroke="#1b1b1f" stroke-width="5"/>
    <g stroke="#1b1b1f" stroke-width="4">
      <line x1="190" y1="300" x2="200" y2="292"/>
      <line x1="206" y1="262" x2="217" y2="262"/>
      <line x1="256" y1="232" x2="256" y2="244"/>
      <line x1="306" y1="262" x2="295" y2="262"/>
      <line x1="322" y1="300" x2="312" y2="292"/>
    </g>
    <path d="M276 236 A72 72 0 0 1 322 300" stroke="#f4a93c" stroke-width="9"/>
  </g>
  <!-- needle -->
  <line x1="256" y1="304" x2="296" y2="240" stroke="#c4372b" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="304" r="10" fill="#1b1b1f"/>
  <!-- calculator dial and button -->
  <circle cx="256" cy="384" r="42" fill="#0e0e11" stroke="#f4a93c" stroke-width="6"/>
  <g stroke="#f5f4f0" stroke-width="5" stroke-linecap="round">
    <line x1="256" y1="350" x2="256" y2="362"/>
    <line x1="290" y1="384" x2="278" y2="384"/>
    <line x1="256" y1="418" x2="256" y2="406"/>
    <line x1="222" y1="384" x2="234" y2="384"/>
  </g>
  <circle cx="256" cy="384" r="9" fill="#f4a93c"/>
  </g>
</svg>
